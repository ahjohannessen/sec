version = "3.11.5"

maxColumn = 120

runner.dialect = scala3

danglingParentheses.defnSite = true
danglingParentheses.callSite = true

align {
  preset = most
  multiline = false
  openParenCallSite = false
  openParenDefnSite = false
  tokens."+" = [
    { code = "=", owner = "(Enumerator.Val|Term.Assign|Defn.(Va(l|r)|GivenAlias|Def|Type))" },
    { code = "=>", owner = "Case" }
  ]
}

indent {
  defnSite   = 2
  extendSite = 2
}

newlines {
  penalizeSingleSelectMultiArgList = false
  sometimesBeforeColonInMethodReturnType = false
  avoidAfterYield = false
  alwaysBeforeMultilineDef = false
  implicitParamListModifierPrefer = before
  afterCurlyLambdaParams = squash
}

rewrite {

  rules = [
    SortModifiers
    Imports
  ]

  imports.sort = original

  sortModifiers.order = [
    "implicit", "private", "final", "sealed", "abstract",
    "override", "protected", "lazy"
  ]
}

project {
  git = true
}

rewrite.scala3 {
  convertToNewSyntax = true
  newSyntax.control = false
}
